# ===============================
# Application Configuration
# ===============================
spring.application.name=Resume-analyser

# ===============================
# Database Configuration
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgres:5432/resume_analayzer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true

# ===============================
# JPA / Hibernate Settings
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# API / Mail / Custom Keys
# ===============================
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
apiKey=${API_KEY:change-me}
genKey=${GEN_KEY:change-me}

# ===============================
# File Upload Settings
# ===============================
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
uploads.path=${UPLOADS_PATH:uploads}

# ===============================
# Connection Pool (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# Server Configuration
# ===============================
server.port=${PORT:8086}

# ===============================
# Additional (optional)
# ===============================
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO

# ===============================
# OAuth2 Client Credentials (Google)
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:change-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:change-me}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ===============================
# Adzuna Credentials
# ===============================
application-id=${APPLICATION_ID:change-me}
application-api-key=${APPLICATION_API_KEY:change-me}

# ===============================
# JWT Credentials
# ===============================
jwt-key=${JWT_SECRET:change-me}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
