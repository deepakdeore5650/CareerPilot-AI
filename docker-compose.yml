services:
  app:
    build:
      context: .
      dockerfile: Back-End/Dockerfile
    image: careerpilot-ai:latest
    container_name: careerpilot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8086}:8086"
    environment:
      PORT: ${APP_PORT:-8086}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-resume_analayzer}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      API_KEY: ${API_KEY:-change-me}
      GEN_KEY: ${GEN_KEY:-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-change-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-change-me}
      APPLICATION_ID: ${APPLICATION_ID:-change-me}
      APPLICATION_API_KEY: ${APPLICATION_API_KEY:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      UPLOADS_PATH: /app/uploads
    volumes:
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${APP_PORT:-8086}/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - careerpilot-net

  postgres:
    image: postgres:16-alpine
    container_name: careerpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_analayizer}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resume_analayizer}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - careerpilot-net

  frontend:
    build:
      context: ./Front-End
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8086
    image: careerpilot-frontend:latest
    container_name: careerpilot-frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8086
    networks:
      - careerpilot-net

volumes:
  postgres_data:
  app_uploads:

networks:
  careerpilot-net:
    driver: bridge
